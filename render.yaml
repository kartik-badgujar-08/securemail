services:
  - type: web
    name: mailsec-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MAX_UPLOAD_SIZE_MB
        value: 100
      - key: UPLOAD_DIR
        value: uploads
